services:
  - type: web
    name: fastchat-api
    env: python
    region: frankfurt
    plan: free
    branch: main
    rootDir: Backend-python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: SECRET_KEY
        sync: false

  - type: web
    name: fastchat-socket
    env: node
    region: frankfurt
    plan: free
    branch: main
    rootDir: Backend-nodejs
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: PORT
        value: 10000

  - type: web
    name: fastchat-frontend
    env: static
    plan: free
    branch: main
    rootDir: Frontend_css
    buildCommand: echo "No build needed"
    staticPublishPath: .
