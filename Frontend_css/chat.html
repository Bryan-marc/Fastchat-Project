<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FastChat - Chat</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-gray-900 h-screen overflow-hidden">
    
    <div class="flex flex-col h-screen">
        
        <header class="bg-gradient-to-r from-purple-600 to-pink-600 text-white p-4 shadow-lg">
            <div class="max-w-6xl mx-auto flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <h1 class="text-2xl font-bold">💬 FastChat</h1>
                    <span class="bg-white/20 px-3 py-1 rounded-full text-sm">Session Active</span>
                </div>
                
                <div class="flex items-center gap-4">
                    <div class="flex items-center gap-2 bg-white/10 px-4 py-2 rounded-lg">
                        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
                            <path d="M9 6a3 3 0 11-6 0 3 3 0 016 0zM17 6a3 3 0 11-6 0 3 3 0 016 0zM12.93 17c.046-.327.07-.66.07-1a6.97 6.97 0 00-1.5-4.33A5 5 0 0119 16v1h-6.07zM6 11a5 5 0 015 5v1H1v-1a5 5 0 015-5z"/>
                        </svg>
                        <span id="participant-count">0</span>
                        <span class="text-sm">participants</span>
                    </div>
                    
                    <button 
                        id="btn-leave" 
                        class="bg-red-500 hover:bg-red-600 px-4 py-2 rounded-lg font-medium transition-all"
                    >
                        Quitter
                    </button>
                </div>
            </div>
        </header>

        <div class="flex-1 flex overflow-hidden">
            
            <aside class="w-64 bg-gray-800 border-r border-gray-700 overflow-y-auto">
                <div class="p-4">
                    <h2 class="text-white font-bold mb-4 flex items-center gap-2">
                        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
                            <path d="M9 6a3 3 0 11-6 0 3 3 0 016 0zM17 6a3 3 0 11-6 0 3 3 0 016 0zM12.93 17c.046-.327.07-.66.07-1a6.97 6.97 0 00-1.5-4.33A5 5 0 0119 16v1h-6.07zM6 11a5 5 0 015 5v1H1v-1a5 5 0 015-5z"/>
                        </svg>
                        Participants
                    </h2>
                    <div id="participants-list" class="space-y-2">
                    </div>
                </div>
            </aside>

            <main class="flex-1 flex flex-col bg-gray-900">
                
                <div id="messages-container" class="flex-1 overflow-y-auto p-6 space-y-4">
                    <div class="text-center text-gray-400 text-sm">
                        <p>🔒 Chat éphémère sécurisé</p>
                        <p class="mt-1">Les messages disparaîtront à la fin de la session</p>
                    </div>
                </div>

                <div class="bg-gray-800 border-t border-gray-700 p-4">
                    <form id="message-form" class="max-w-4xl mx-auto flex gap-3">
                        <input 
                            type="text" 
                            id="message-input" 
                            placeholder="Tapez votre message..."
                            class="flex-1 bg-gray-700 text-white px-4 py-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500"
                            autocomplete="off"
                            required
                        >
                        <button 
                            type="submit" 
                            class="bg-gradient-to-r from-purple-500 to-pink-500 text-white px-6 py-3 rounded-lg font-medium hover:from-purple-600 hover:to-pink-600 transition-all"
                        >
                            Envoyer
                        </button>
                    </form>
                </div>
            </main>
        </div>
    </div>

    <div id="leave-modal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl p-6 max-w-md w-full">
            <h2 class="text-2xl font-bold mb-4 text-gray-800">Quitter le chat ?</h2>
            <p class="text-gray-600 mb-6">
                Voulez-vous vraiment quitter la session ? Tous les messages seront supprimés.
            </p>
            <div class="flex gap-3">
                <button 
                    id="btn-confirm-leave" 
                    class="flex-1 bg-red-500 text-white font-bold py-2 rounded-lg hover:bg-red-600"
                >
                    Oui, quitter
                </button>
                <button 
                    id="btn-cancel-leave" 
                    class="flex-1 bg-gray-300 text-gray-700 font-bold py-2 rounded-lg hover:bg-gray-400"
                >
                    Annuler
                </button>
            </div>
        </div>
    </div>

    <div id="edit-modal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl p-6 max-w-md w-full">
            <h2 class="text-2xl font-bold mb-4 text-gray-800">Modifier le message</h2>
            <textarea 
                id="edit-content" 
                class="w-full bg-gray-100 text-gray-800 px-4 py-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500 mb-4"
                rows="4"
            ></textarea>
            <div class="flex gap-3">
                <button 
                    id="btn-save-edit" 
                    class="flex-1 bg-purple-500 text-white font-bold py-2 rounded-lg hover:bg-purple-600"
                >
                    Enregistrer
                </button>
                <button 
                    id="btn-cancel-edit" 
                    class="flex-1 bg-gray-300 text-gray-700 font-bold py-2 rounded-lg hover:bg-gray-400"
                >
                    Annuler
                </button>
            </div>
        </div>
    </div>

    <script src="js/chat.js"></script>
</body>
</html>
